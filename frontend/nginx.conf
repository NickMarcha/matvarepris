server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend routes are mounted at /api on the express app; forwarding the
    # request as-is (no path rewrite) keeps that mapping intact.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Plain multi-page nav (main.tsx switches on window.location.pathname)
    # still needs every path served the same index.html shell, since there
    # are no separate physical files per page.
    location / {
        try_files $uri /index.html;
    }
}

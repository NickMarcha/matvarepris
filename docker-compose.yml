services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matvarepris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matvarepris}
      POSTGRES_DB: ${POSTGRES_DB:-matvarepris}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matvarepris}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-matvarepris}:${POSTGRES_PASSWORD:-matvarepris}@db:5432/${POSTGRES_DB:-matvarepris}
      PORT: 4000
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 */6 * * *}
      INGEST_ON_STARTUP: ${INGEST_ON_STARTUP:-true}
      NUTRITION_CRAWL_DELAY_MS: ${NUTRITION_CRAWL_DELAY_MS:-2000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-4000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    command: npm run dev -- --host

volumes:
  db_data:

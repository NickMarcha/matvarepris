services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matvarepris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matvarepris}
      POSTGRES_DB: ${POSTGRES_DB:-matvarepris}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matvarepris}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-matvarepris}:${POSTGRES_PASSWORD:-matvarepris}@db:5432/${POSTGRES_DB:-matvarepris}
      PORT: 4000
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 3 * * *}
      INGEST_ON_STARTUP: ${INGEST_ON_STARTUP:-true}
      NUTRITION_CRAWL_DELAY_MS: ${NUTRITION_CRAWL_DELAY_MS:-2000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  db_data:
